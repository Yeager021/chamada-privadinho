<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeo com Som - Confirmação</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        video {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        .blur { filter: blur(20px); transition: filter 1s; }

        /* Tela de confirmação */
        .confirm-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 30px 40px;
            border-radius: 16px;
            text-align: center;
            max-width: 90%;
            box-shadow: 0 0 20px rgba(255,255,255,0.1);
            z-index: 10;
        }
        .confirm-box h2 {
            font-size: 1.8em;
            margin-bottom: 20px;
        }
        .confirm-box p {
            font-size: 1.1em;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        .btn {
            background: #00d4ff;
            color: #000;
            border: none;
            padding: 12px 28px;
            margin: 0 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1em;
        }
        .btn:hover { background: #00b8e6; transform: scale(1.05); }
        .btn-no { background: #333; color: #fff; }
        .btn-no:hover { background: #555; }

        /* Mensagem de expirado */
        .expired {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.5em;
            font-weight: bold;
            text-align: center;
            opacity: 0;
            transition: opacity 1.5s;
            width: 90%;
        }
        .show { opacity: 1; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Vídeo carregado via JavaScript -->
        <video id="v" playsinline></video>

        <!-- Tela de confirmação -->
        <div class="confirm-box" id="confirm">
            <h2>Reproduzir vídeo com som?</h2>
            <p>Este é um vídeo privado. Deseja assistir agora?</p>
            <button class="btn" id="sim">Sim, reproduzir</button>
            <button class="btn btn-no" id="nao">Não</button>
        </div>

        <!-- Mensagem de expirado -->
        <div class="expired" id="expired">Esse vídeo privado expirou!</div>
    </div>

    <script>
        // ====== COLOQUE SEU LINK AQUI ======
        const VIDEO_URL = "http://video.vps.gnndigital.uk:8080/videos/videocam1.mp4"; // ← ALTERE ESTA LINHA

        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('v');
            const confirmBox = document.getElementById('confirm');
            const expiredMsg = document.getElementById('expired');
            const btnSim = document.getElementById('sim');
            const btnNao = document.getElementById('nao');

            // ====== CARREGA VÍDEO VIA LINK ======
            video.src = VIDEO_URL;
            video.load(); // Força o carregamento

            // Verifica se já foi visto
            if (sessionStorage.getItem('videoVisto')) {
                confirmBox.remove();
                video.remove();
                expiredMsg.classList.add('show');
                return;
            }

            // Botão SIM
            btnSim.addEventListener('click', () => {
                confirmBox.remove();
                video.style.display = 'block';

                video.play().catch(err => {
                    alert("Erro ao reproduzir: " + err.message);
                });

                video.onended = () => {
                    video.classList.add('blur');
                    expiredMsg.classList.add('show');
                    sessionStorage.setItem('videoVisto', 'true');
                };
            });

            // Botão NÃO
            btnNao.addEventListener('click', () => {
                confirmBox.remove();
                video.remove();
                expiredMsg.classList.add('show');
                sessionStorage.setItem('videoVisto', 'true');
            });
        });
    </script>

</body>
</html>
